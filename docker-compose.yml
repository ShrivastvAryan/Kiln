# Infrastructure for Kiln: PostgreSQL (source of truth), Redis (queue + pub/sub) and MinIO (S3-compatible storage).
# Start with: npm run infra:up
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: deployx
      POSTGRES_PASSWORD: deployx
      POSTGRES_DB: deployx
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployx"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: deployx
      MINIO_ROOT_PASSWORD: deployx-secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
